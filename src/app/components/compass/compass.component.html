<div class="flex h-screen w-full overflow-hidden font-sans">

    <!-- Left Side: Clean Map -->
    <div class="relative w-1/2 h-full bg-slate-100">
        <div id="map-compass" class="absolute inset-0 z-0"></div>
    </div>

    <!-- Right Side: Red Panel with 3D Interaction -->
    <div class="w-1/2 h-full bg-[#EF4444] flex flex-col items-center justify-center relative shadow-2xl z-20 overflow-hidden"
        (wheel)="onWheel($event)">

        <!-- Background Decor -->
        <div class="absolute inset-0 pointer-events-none opacity-10 bg-[url('/assets/pattern.png')]"></div>
        <div class="absolute left-0 top-0 bottom-0 border-l-2 border-dashed border-white/20 h-full"></div>

        <!-- 3D Title -->
        <h1
            class="text-3d text-7xl font-black mb-8 tracking-wide z-10 transition-transform hover:scale-105 duration-300">
            UniVelo
        </h1>

        <!-- Search Bar -->
        <div class="w-[380px] mb-6 z-50 relative">
            <div class="relative group">
                <input type="text" [(ngModel)]="searchTerm" (keyup)="onSearch()" placeholder="Rechercher une école..."
                    class="w-full rounded-full py-4 px-8 text-gray-800 font-bold focus:outline-none focus:ring-4 focus:ring-yellow-400 shadow-xl placeholder-gray-400 text-lg transition-transform focus:scale-105">
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-6 w-6 text-gray-400 absolute right-6 top-1/2 -translate-y-1/2" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </div>
        </div>

        <p class="text-white/80 mb-6 text-center max-w-sm z-10 text-sm font-medium">
            Utilisez la molette ou les flèches pour naviguer.
        </p>

        <!-- 3D Stack Container -->
        <div class="relative w-[400px] h-[450px] perspective-1000 flex items-start justify-center pt-8">

            <!-- No Results -->
            <div *ngIf="etablissements.length === 0" class="text-white font-bold text-xl mt-10 animate-pulse">
                Aucun résultat trouvé.
            </div>

            <!-- Cards Loop -->
            <div *ngFor="let etab of etablissements; let i = index" (click)="selectEtab(i)"
                class="absolute w-full h-56 rounded-3xl shadow-2xl cursor-pointer p-8 flex items-end border-b-4 border-black/10 hover:brightness-110"
                [ngStyle]="getCardStyle(i)">

                <!-- Card Shine -->
                <div
                    class="absolute inset-0 bg-gradient-to-tr from-white/20 to-transparent rounded-3xl pointer-events-none">
                </div>

                <!-- Card Content -->
                <div class="relative z-10">
                    <span class="text-xs font-bold opacity-70 uppercase tracking-widest mb-1 block">Campus</span>
                    <h3 class="text-3xl font-black leading-tight drop-shadow-sm line-clamp-2">
                        {{ etab.properties.nom }}
                    </h3>
                </div>
            </div>

        </div>

        <!-- Navigation Buttons (Floating) -->
        <div class="absolute right-8 top-1/2 -translate-y-1/2 flex flex-col gap-6 z-50">
            <button (click)="prevCard()"
                class="p-4 bg-white/20 hover:bg-white text-white hover:text-[#EF4444] rounded-full backdrop-blur-sm transition-all shadow-lg transform hover:scale-110 hover:-translate-x-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7" />
                </svg>
            </button>
            <button (click)="nextCard()"
                class="p-4 bg-white/20 hover:bg-white text-white hover:text-[#EF4444] rounded-full backdrop-blur-sm transition-all shadow-lg transform hover:scale-110 hover:-translate-x-1">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 9l-7 7-7-7" />
                </svg>
            </button>
        </div>

        <!-- Action Button -->
        <div class="mt-2 z-50">
            <button (click)="goToExplorer()"
                class="bg-white text-[#EF4444] px-12 py-5 rounded-full font-bold shadow-xl hover:bg-gray-50 transform hover:-translate-y-1 hover:scale-105 transition-all duration-300 flex items-center gap-3 text-2xl tracking-tight ring-4 ring-white/30">
                E X P L O R E R
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
                        clip-rule="evenodd" />
                </svg>
            </button>
        </div>

    </div>
</div>
